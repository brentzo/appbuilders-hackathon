[versions]
agp = "8.13.2"
kotlin = "2.4.21"
coreKtx = "1.18.0"
activityCompose = "1.12.4"
composeBom = "2026.06.01"
lifecycle = "2.10.0"
datastore = "1.2.1"
coroutines = "1.11.0"
junit = "4.13.2"
# 1.28.0 is the newest ONNX Runtime without telemetry. 1.29.0 and later add INTERNET and a provider that starts an
# HTTP telemetry client at app start, which breaks "everything runs locally". Check the AAR manifest before bumping.
onnxruntime = "1.28.0"
# Vosk spots "Hey Yumi" until OBJ-12's model is ready (OBJ-59). Its POM excludes JNA's transitive dependencies and
# wants the AAR, so JNA is declared on its own at the version Vosk's POM names.
vosk = "0.3.75"
jna = "5.18.1"
# The bridge (OBJ-23): libsodium through lazysodium (protocol/docs/crypto.md), the relay over OkHttp's WebSocket,
# and the pairing QR code read on the device with CameraX and ZXing (no Google Play services, no network).
lazysodium = "5.2.0"
# 5.x needs compile SDK 37 (README Decisions keep us on 36), so the 4.x line.
okhttp = "4.12.0"
serialization = "1.11.0"
camerax = "1.6.2"
zxing = "3.5.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
lazysodium-android = { group = "com.goterl", name = "lazysodium-android", version.ref = "lazysodium" }
# The desktop build of the same lazysodium, so unit tests check the crypto against the protocol's vectors on the JVM.
lazysodium-java = { group = "com.goterl", name = "lazysodium-java", version.ref = "lazysodium" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# The desktop build of the same ONNX Runtime version, so unit tests run the real models on the JVM.
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
