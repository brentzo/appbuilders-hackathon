services:
  bridge:
    build:
      context: ..
      dockerfile: bridge/Dockerfile
    image: yumi-bridge:local
    restart: unless-stopped
    init: true
    read_only: true
    # No `no-new-privileges`: Snap's Docker (the VPS's) then refuses to start any program in the container.
    # The relay still runs as the unprivileged node user, with every capability dropped and a read-only filesystem.
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 8787
      BRIDGE_DATABASE_PATH: /data/bridge.sqlite
      # The deployed commit, shown on /health. The deploy command sets it from the REVISION file.
      BRIDGE_REVISION: ${BRIDGE_REVISION:-unknown}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
